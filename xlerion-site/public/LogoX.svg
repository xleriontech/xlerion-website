<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b8c9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="900" fill="#070710"/>
  
  <!-- Circuit traces - white/gray base -->
  <g stroke="#cccccc" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical trace -->
    <path d="M 240 120 L 240 200 L 280 240 L 280 320"/>
    <circle cx="240" cy="120" r="8" fill="#cccccc"/>
    <circle cx="280" cy="320" r="8" fill="#cccccc"/>
    
    <!-- Right vertical trace -->
    <path d="M 560 120 L 560 200 L 520 240 L 520 320"/>
    <circle cx="560" cy="120" r="8" fill="#cccccc"/>
    <circle cx="520" cy="320" r="8" fill="#cccccc"/>
    
    <!-- Middle left trace -->
    <path d="M 300 160 L 300 280 L 340 320 L 340 400"/>
    <circle cx="300" cy="160" r="8" fill="#cccccc"/>
    <circle cx="340" cy="400" r="8" fill="#cccccc"/>
    
    <!-- Middle right trace -->
    <path d="M 500 160 L 500 280 L 460 320 L 460 400"/>
    <circle cx="500" cy="160" r="8" fill="#cccccc"/>
    <circle cx="460" cy="400" r="8" fill="#cccccc"/>
    
    <!-- Bottom traces -->
    <path d="M 320 360 L 320 440 L 360 480"/>
    <circle cx="320" cy="360" r="8" fill="#cccccc"/>
    <circle cx="360" cy="480" r="8" fill="#cccccc"/>
    
    <path d="M 480 360 L 480 440 L 440 480"/>
    <circle cx="480" cy="360" r="8" fill="#cccccc"/>
    <circle cx="440" cy="480" r="8" fill="#cccccc"/>
  </g>
  
  <!-- Cyan highlighted traces -->
  <g stroke="url(#cyanGlow)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Main center trace -->
    <path d="M 400 80 L 400 180 L 360 220 L 360 340 L 400 380 L 400 500"/>
    <circle cx="400" cy="80" r="10" fill="#00e9fa"/>
    <circle cx="400" cy="500" r="10" fill="#00e9fa"/>
    
    <!-- Left cyan branch -->
    <path d="M 280 240 L 320 280 L 320 360"/>
    <circle cx="320" cy="360" r="8" fill="#00e9fa"/>
    
    <!-- Right cyan branch -->
    <path d="M 520 240 L 480 280 L 480 360"/>
    <circle cx="480" cy="360" r="8" fill="#00e9fa"/>
  </g>
  
  <!-- Glowing nodes -->
  <g filter="url(#strongGlow)">
    <circle cx="400" cy="80" r="12" fill="#00e9fa"/>
    <circle cx="400" cy="500" r="12" fill="#00e9fa"/>
    <circle cx="320" cy="360" r="10" fill="#00e9fa"/>
    <circle cx="480" cy="360" r="10" fill="#00e9fa"/>
  </g>
  
  <!-- XLERION Text -->
  <text x="400" y="620" text-anchor="middle" font-family="'Courier New', monospace" font-size="90" font-weight="bold" fill="#00e9fa" letter-spacing="12" filter="url(#glow)">XLERION</text>
  
  <!-- Subtitle -->
  <text x="400" y="680" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" fill="#888888" letter-spacing="8">ULTIMATE TECH</text>
  
  <!-- TM symbol -->
  <text x="710" y="585" font-family="'Courier New', monospace" font-size="18" fill="#00e9fa">™</text>
</svg>
